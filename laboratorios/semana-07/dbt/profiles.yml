# =====================================================================
# Conexión de dbt a Snowflake.
#
# No contiene secretos: todo se lee de variables de entorno, que Kestra
# le pasa a dbt (las mismas que usa la ingesta). La autenticación es con
# la llave privada del usuario de servicio, igual que en la ingesta.
# =====================================================================
nyc_taxi:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      # Esquema por defecto. Cada capa lo reemplaza por el suyo
      # (ver dbt_project.yml y macros/generate_schema_name.sql).
      schema: BRONZE
      threads: 4
      query_tag: nyc_taxi_dbt
