# =====================================================================
# Infraestructura local del laboratorio (Docker Compose)
#
#   kestra-db  -> Postgres donde Kestra guarda sus flujos y ejecuciones
#   kestra     -> el orquestador. Usa una imagen propia (infra/kestra)
#                 que trae Python, el conector de Snowflake y dbt.
#
# El data warehouse ya no es local: es Snowflake, en la nube.
# Los datos de conexión se leen del archivo .env de esta carpeta.
#
# Uso:  docker compose up -d --build     (levantar)
#       docker compose down              (apagar)
# =====================================================================
name: nyc-taxi-lab

services:

  kestra-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
      POSTGRES_DB: kestra
    volumes:
      - kestra-db-data:/var/lib/postgresql/data
    # Kestra espera a que Postgres esté listo antes de arrancar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 5s
      timeout: 5s
      retries: 10

  kestra:
    build: ./infra/kestra
    image: nyc-taxi-kestra:1.3.37
    user: "root"
    command: ["server", "standalone"]
    ports:
      - "8080:8080"

    environment:
      # Variables que los flujos leen como {{ envs.snowflake_account }}, etc.
      # Los valores salen del archivo .env (si falta alguno, compose avisa).
      ENV_SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:?Falta SNOWFLAKE_ACCOUNT en .env}
      ENV_SNOWFLAKE_USER: ${SNOWFLAKE_USER:?Falta SNOWFLAKE_USER en .env}
      ENV_SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:?Falta SNOWFLAKE_ROLE en .env}
      ENV_SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:?Falta SNOWFLAKE_WAREHOUSE en .env}
      ENV_SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:?Falta SNOWFLAKE_DATABASE en .env}
      ENV_SNOWFLAKE_PRIVATE_KEY_PATH: /opt/lab/keys/rsa_key.p8
      ENV_LAB_DIR: /opt/lab

      # Configuración de Kestra
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db:5432/kestra
            driver-class-name: org.postgresql.Driver
            username: kestra
            password: kestra

        kestra:
          server:
            basic-auth:
              enabled: false
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          # Sin flujos de ejemplo: solo queremos los de la carpeta flows/
          tutorial-flows:
            enabled: false
          url: http://localhost:8080

        # Kestra vigila la carpeta flows/ y carga automáticamente
        # cualquier flujo .yml que agregues o modifiques ahí
        micronaut:
          io:
            watch:
              enabled: true
              paths:
                - /opt/lab/flows

    volumes:
      - kestra-storage:/app/storage
      # La carpeta semana-07 completa aparece dentro del contenedor
      # como /opt/lab (código de ingesta, SQL, dbt, flujos y llaves)
      - ./:/opt/lab

    depends_on:
      kestra-db:
        condition: service_healthy


# Persistencia: los datos de Kestra sobreviven a un "docker compose down"
volumes:
  kestra-db-data:
  kestra-storage: